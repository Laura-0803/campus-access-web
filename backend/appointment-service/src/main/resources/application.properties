server.address=127.0.0.1
server.port=19821
spring.application.name=appointment-service
spring.datasource.url=${P3_DB_URL}
spring.datasource.username=${P3_DB_USER}
spring.datasource.password=${P3_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.local-cache-scope=STATEMENT
server.error.include-message=never
eureka.client.service-url.defaultZone=http://localhost:19761/eureka/,http://127.0.0.1:19762/eureka/
eureka.client.registry-fetch-interval-seconds=3
eureka.client.initial-instance-info-replication-interval-seconds=1
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=90
user-service.ribbon.ServerListRefreshInterval=1000
user-service.ribbon.NFLoadBalancerRuleClassName=com.netflix.loadbalancer.RoundRobinRule
feign.hystrix.enabled=true
feign.client.config.default.connectTimeout=700
feign.client.config.default.readTimeout=1200
hystrix.command.default.execution.isolation.thread.timeoutInMilliseconds=2200
hystrix.command.default.circuitBreaker.requestVolumeThreshold=4
hystrix.command.default.circuitBreaker.errorThresholdPercentage=50
hystrix.command.default.circuitBreaker.sleepWindowInMilliseconds=3000
logging.level.com.netflix.discovery=WARN
logging.level.com.netflix.eureka=WARN
legacy-bridge.ribbon.ServerListRefreshInterval=1000
access-service.ribbon.ServerListRefreshInterval=1000

exception-service.ribbon.ServerListRefreshInterval=1000
exception-service.ribbon.NFLoadBalancerRuleClassName=com.netflix.loadbalancer.RoundRobinRule
