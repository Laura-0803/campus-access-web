server.address=127.0.0.1
server.port=19861
spring.application.name=aggregation-service
eureka.client.service-url.defaultZone=http://localhost:19761/eureka/,http://127.0.0.1:19762/eureka/
eureka.client.registry-fetch-interval-seconds=3
eureka.client.initial-instance-info-replication-interval-seconds=1
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=90
feign.hystrix.enabled=true
feign.client.config.default.connectTimeout=500
feign.client.config.default.readTimeout=1600
hystrix.command.default.execution.isolation.thread.timeoutInMilliseconds=2300
hystrix.command.default.circuitBreaker.requestVolumeThreshold=4
hystrix.command.default.circuitBreaker.errorThresholdPercentage=50
hystrix.command.default.circuitBreaker.sleepWindowInMilliseconds=3000
hystrix.threadpool.default.coreSize=12
server.error.include-message=never
spring.jackson.default-property-inclusion=always
logging.level.com.netflix.discovery=WARN
logging.level.com.netflix.eureka=WARN
user-service.ribbon.ServerListRefreshInterval=1000
user-service.ribbon.NFLoadBalancerRuleClassName=com.netflix.loadbalancer.RoundRobinRule
appointment-service.ribbon.ServerListRefreshInterval=1000
appointment-service.ribbon.NFLoadBalancerRuleClassName=com.netflix.loadbalancer.RoundRobinRule
access-service.ribbon.ServerListRefreshInterval=1000
access-service.ribbon.NFLoadBalancerRuleClassName=com.netflix.loadbalancer.RoundRobinRule
exception-service.ribbon.ServerListRefreshInterval=1000
exception-service.ribbon.NFLoadBalancerRuleClassName=com.netflix.loadbalancer.RoundRobinRule
campus-gateway.ribbon.ServerListRefreshInterval=1000
campus-gateway.ribbon.NFLoadBalancerRuleClassName=com.netflix.loadbalancer.RoundRobinRule
